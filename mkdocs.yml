site_name: GeoAIアトラス
site_url: https://isshiki.github.io/weekly-geoai/
site_description: 地図・位置情報データとAIの知見を体系的に整理する
repo_url: https://github.com/isshiki/weekly-geoai
repo_name: isshiki/weekly-geoai
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

nav:
  - ホーム: index.md
  - 知識マップ:
      - 全体を見る: atlas/index.md
      - 概念:
          - ロケーションインテリジェンス: atlas/concepts/location-intelligence.md
          - 地図投影法:
              - 選び方と分類: atlas/concepts/map-projections.md
              - メルカトル図法: atlas/concepts/mercator-projection.md
              - イコールアース図法: atlas/concepts/equal-earth-projection.md
          - リアリティーマッピングとデジタルツイン: atlas/concepts/reality-mapping-and-digital-twins.md
      - 手法:
          - 知識グラフとLLMエージェントによる地理空間データ探索: atlas/methods/intelligent-geospatial-data-discovery.md
          - 人流データの時間処理と集計定義: atlas/methods/human-flow-time-processing.md
      - データ:
          - 人流データ:
              - 種類と加工段階: atlas/data/human-flow-data-types.md
              - 計測誤差と推計誤差: atlas/data/human-flow-data-quality.md
              - 日本で使えるデータ: atlas/data/human-flow-data-sources-japan.md
          - Foursquare Placesへのパートナーデータ取り込み: atlas/data/foursquare-partner-places.md
          - Portolan: atlas/data/portolan.md
      - ツール:
          - 日本のロケーションインテリジェンス製品・サービス: atlas/tools/location-intelligence-products-japan.md
          - H3: atlas/tools/h3.md
          - Google Places Insights: atlas/tools/google-places-insights.md
          - geoparquet-io: atlas/tools/geoparquet-io.md
          - 高徳地図（AMAP）: atlas/tools/amap.md
          - Galuchat: atlas/tools/galuchat.md
          - DOCOYAフード&ビバレッジ: atlas/tools/docoya-food-beverage.md
          - ゼンリン地図ナビ: atlas/tools/zenrin-map-navigation.md
          - GeoLibre: atlas/tools/geolibre.md
          - Cesium: atlas/tools/cesium.md
      - 事例:
          - pricemap: atlas/cases/pricemap.md
          - 小売出店候補地のロケーションインテリジェンス: atlas/cases/retail-site-selection.md
  - 更新記録:
      - 更新記録一覧: updates/index.md
      - 2026年9月8日: updates/2026-09-08.md
      - 2026年9月7日: updates/2026-09-07.md
      - 2026年9月6日: updates/2026-09-06.md
      - 2026年9月5日: updates/2026-09-05.md
      - 2026年9月4日: updates/2026-09-04.md
  - このサイトについて: about.md
  - 週刊GeoAI バックナンバー: https://weeklygeoai.substack.com/archive

plugins:
  - search:
      lang: ja

markdown_extensions:
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: GeoAIアトラス — 地図・位置情報データとAIの知識をつなぐ
