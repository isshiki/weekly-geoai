              - STLOCAL: atlas/tools/stlocal.md
              - 日本のロケーションインテリジェンス製品・サービス: atlas/tools/location-intelligence-products-japan.md
              - コンプレノ: atlas/tools/kompreno.md
              - PASSER-MARKETING: atlas/tools/passer-marketing.md
              - Google Places Insights: atlas/tools/google-places-insights.md
              - DOCOYAフード&ビバレッジ: atlas/tools/docoya-food-beverage.md
              - LightBox: atlas/tools/lightbox.md
          - 学習・キャリア:
              - GIS Career Hub: atlas/tools/gis-career-hub.md
      - 事例:
          - 小売・出店・価格比較:
              - 小売出店候補地のロケーションインテリジェンス: atlas/cases/retail-site-selection.md
              - ブラックフライデーの小売来訪分析: atlas/cases/black-friday-retail-visitation.md
              - pricemap: atlas/cases/pricemap.md
          - 位置情報を使う広告:
              - 来店検知を使う位置連動リテールメディア: atlas/cases/location-triggered-retail-media.md
              - 来訪傾向を使う音声広告セグメント: atlas/cases/behavior-affinity-audio-ads.md
          - 都市・観光・働き方・物流:
              - 運転支援と地図の継続更新: atlas/cases/streaming-maps-driver-assistance.md
              - 渋谷の街区別年代構成と人流の読み方: atlas/cases/shibuya-age-distribution.md
              - 旅客船のAIS位置情報の可視化: atlas/cases/ais-passenger-vessels.md
              - 富士山閉山期の人流分析: atlas/cases/mount-fuji-offseason-human-flow.md
              - 人流データによるオフィス訪問指数: atlas/cases/office-visitation-index.md
