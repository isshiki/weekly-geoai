          - AI・MCP連携:
              - Google Maps Agentic UI Toolkit: atlas/tools/google-maps-agentic-ui.md
              - Mapbox Figma MCP Server: atlas/tools/mapbox-figma-mcp.md
              - MCP for ArcGIS Location Services: atlas/tools/arcgis-location-services-mcp.md
              - CARTO MCP Server: atlas/tools/carto-mcp-server.md
              - BigGeo AI: atlas/tools/biggeo-ai.md
          - 人流・商圏・不動産分析:
