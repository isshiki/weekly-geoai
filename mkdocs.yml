site_name: GeoAIアトラス
site_url: https://isshiki.github.io/weekly-geoai/
site_description: 地図・位置情報データとAIの知見を体系的に整理する
repo_url: https://github.com/isshiki/weekly-geoai
repo_name: isshiki/weekly-geoai
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

nav:
  - ホーム: index.md
  - 知識マップ:
      - 全体を見る: atlas/index.md
      - 概念:
          - 位置情報の活用とAI:
              - ロケーションインテリジェンス: atlas/concepts/location-intelligence.md
              - Location AI: atlas/concepts/location-ai.md
              - 地理空間モデルの予測と地理的理解: atlas/concepts/geographic-model-reasoning.md
          - 座標参照系と地図投影法:
              - 選び方と分類: atlas/concepts/map-projections.md
              - 座標参照系（CRS）との関係: atlas/concepts/coordinate-reference-systems.md
              - メルカトル図法: atlas/concepts/mercator-projection.md
              - イコールアース図法: atlas/concepts/equal-earth-projection.md
          - データ基盤と3D空間:
              - GeoAIの標準化と実務での採用: atlas/concepts/geoai-standards-and-adoption.md
              - Cloud Native Geospatial: atlas/concepts/cloud-native-geospatial.md
              - リアリティーマッピングとデジタルツイン: atlas/concepts/reality-mapping-and-digital-twins.md
      - 手法:
          - AIによる分析と位置推定:
              - 空間特徴とLLMエージェントによる次の訪問地点予測: atlas/methods/spatial-agent-mobility-prediction.md
              - 空間分析への埋め込みの組み込み: atlas/methods/spatial-embeddings.md
              - 店舗画像によるPOIローカライゼーション: atlas/methods/storefront-poi-localization.md
          - AI向けのデータ探索と開発:
              - 位置情報PaaSの選び方と相互運用性: atlas/methods/location-paas-selection.md
              - 知識グラフとLLMエージェントによる地理空間データ探索: atlas/methods/intelligent-geospatial-data-discovery.md
              - GISデータセットカタログ: atlas/methods/gis-dataset-catalog-for-agents.md
              - AIが扱いやすい地理空間開発環境: atlas/methods/ai-ready-geospatial-development.md
          - 人流の集計とプライバシー:
              - 人流データの時間処理と集計定義: atlas/methods/human-flow-time-processing.md
              - 位置情報データのプライバシー保護: atlas/methods/location-data-privacy.md
          - 主題図・モニタリング・配信:
              - CADからGeoPackageへの変換と検証: atlas/methods/cad-to-geopackage.md
              - 街歩きによるバリア情報マッピング: atlas/methods/barrier-information-mapping.md
              - 手描き地図の座標校正と表示: atlas/methods/illustrated-map-coordinates.md
              - 地域別最多カテゴリ地図の読み方: atlas/methods/regional-winner-maps.md
              - 農業統計・圃場・衛星データを統合する米作モニタリング: atlas/methods/california-rice-monitoring.md
              - 全国メッシュデータのWeb配信: atlas/methods/national-grid-web-delivery.md
              - 外部地図サービスの廃止と依存関係の点検: atlas/methods/map-service-lifecycle.md
      - データ:
          - 人流データ:
              - 種類と加工段階: atlas/data/human-flow-data-types.md
              - 計測誤差と推計誤差: atlas/data/human-flow-data-quality.md
              - 日本で使えるデータ: atlas/data/human-flow-data-sources-japan.md
          - 地理空間データとPOI:
              - オープンな基盤地図データと共同整備: atlas/data/open-foundational-map-data.md
              - POIオープンデータの比較と地域特徴量: atlas/data/poi-open-data-comparison.md
              - ハザードデータの再利用条件: atlas/data/hazard-data-reuse.md
              - 国土数値情報: atlas/data/national-land-numerical-information.md
              - Foursquare Placesへのパートナーデータ取り込み: atlas/data/foursquare-partner-places.md
          - 形式・スキーマ・カタログ:
              - 地理空間データの来歴とレコード単位のメタデータ: atlas/data/geospatial-record-provenance.md
              - Overtureのデータスキーマ: atlas/data/overture-schema.md
              - Portolan: atlas/data/portolan.md
              - ParquetのALP浮動小数点符号化: atlas/data/parquet-alp.md
      - ツール:
          - 地図表示とWeb GIS:
              - OH3 今昔マップビューア: atlas/tools/oh3-konjaku.md
              - Mapbox Standard: atlas/tools/mapbox-standard.md
              - MapLibre GL JS: atlas/tools/maplibre-gl-js.md
              - maplibre-gl-streetview: atlas/tools/maplibre-gl-streetview.md
              - GeoLibre: atlas/tools/geolibre.md
              - Cesium: atlas/tools/cesium.md
              - Felt: atlas/tools/felt.md
              - ArcGIS StoryMaps: atlas/tools/arcgis-storymaps.md
          - 空間分析・データ処理・配信:
              - GeoAI（geoai-py）: atlas/tools/geoai-py.md
              - pandas: atlas/tools/pandas.md
              - FME: atlas/tools/fme.md
              - Spatial Polars: atlas/tools/spatial-polars.md
              - MovingPandas: atlas/tools/movingpandas.md
              - H3: atlas/tools/h3.md
              - geoparquet-io: atlas/tools/geoparquet-io.md
              - GeoServer: atlas/tools/geoserver.md
          - 場所検索・交通・ナビゲーション:
              - Valhalla: atlas/tools/valhalla.md
              - TomTom Orbis APIs: atlas/tools/tomtom-orbis.md
              - Mapbox Search Box API: atlas/tools/mapbox-search-box.md
              - Galuchat: atlas/tools/galuchat.md
