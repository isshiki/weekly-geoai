site_name: GeoAIアトラス
site_url: https://isshiki.github.io/weekly-geoai/
site_description: 地図・位置情報データとAIの知見を体系的に整理する
repo_url: https://github.com/isshiki/weekly-geoai
repo_name: isshiki/weekly-geoai
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

