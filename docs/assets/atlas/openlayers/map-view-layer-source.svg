<svg xmlns="http://www.w3.org/2000/svg" width="540" height="646" viewBox="0 0 540 646" role="img" aria-labelledby="title desc">
<title id="title">OpenLayersの部品の関係</title>
<desc id="desc">MapはViewとレイヤー群を持つ。Viewは中心、ズーム、投影法を管理し、各レイヤーはSourceからデータを受け取る。背景と店舗の二つのレイヤーを重ねる例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="646" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">OpenLayersの部品の関係</text>
<rect x="24" y="78" width="492" height="504" rx="16" fill="#e8eef5" stroke="#1E3A5F" stroke-width="2"/><text x="270" y="115" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Map：地図画面を組み立てる</text><rect x="48" y="138" width="444" height="76" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="167" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">View：どこを、どう見るか</text><text x="270.0" y="195" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">中心・ズーム・投影法</text><text x="270" y="254" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">複数のレイヤーを重ねて表示</text><rect x="44" y="276" width="214" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="151.0" y="305" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Layer A</text><text x="151.0" y="333" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">背景を描く</text><rect x="282" y="276" width="214" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="389.0" y="305" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Layer B</text><text x="389.0" y="333" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">店舗の点を描く</text><path d="M 60 430 V 354" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 478 430 V 354" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="151" y="401" text-anchor="middle" font-size="20" font-weight="400" fill="#1E3A5F">データを渡す</text><text x="389" y="401" text-anchor="middle" font-size="20" font-weight="400" fill="#1E3A5F">データを渡す</text><rect x="44" y="432" width="214" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="151.0" y="461" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Source A</text><text x="151.0" y="489" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">タイルを読む</text><rect x="282" y="432" width="214" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="389.0" y="461" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Source B</text><text x="389.0" y="489" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">店舗データを読む</text><text x="270" y="552" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">各Layerに、対応するSourceを設定</text><text x="270" y="620" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">二つのレイヤーを使う構成例</text>
</g></svg>
