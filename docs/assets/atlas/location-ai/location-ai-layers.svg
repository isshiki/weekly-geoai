<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Location AIの5層</title>
  <desc id="desc">地理空間データからAPIとMCP、Agent Skills、エージェント実行を経て地図や業務結果へ至り、結果が実行へフィードバックされる構成図</desc>
  <rect width="900" height="560" rx="20" fill="#f7f9fc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">Location AIの構成</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="86" width="720" height="68" rx="14" fill="#1E3A5F"/>
    <text x="450" y="116" font-size="22" font-weight="700" fill="#ffffff">5. 結果とフィードバック</text>
    <text x="450" y="140" font-size="16" fill="#ffffff">地図・レポート・Workflow・実行状態</text>

    <rect x="90" y="180" width="720" height="68" rx="14" fill="#FF8A3D"/>
    <text x="450" y="210" font-size="22" font-weight="700" fill="#1E3A5F">4. エージェント実行</text>
    <text x="450" y="234" font-size="16" fill="#1E3A5F">探索・空間分析・ルート・地図作成</text>

    <rect x="90" y="274" width="720" height="68" rx="14" fill="#dce6f2" stroke="#1E3A5F" stroke-width="2"/>
    <text x="450" y="304" font-size="22" font-weight="700" fill="#1E3A5F">3. 指示とガバナンス</text>
    <text x="450" y="328" font-size="16" fill="#1E3A5F">Agent Skills・最新文書・認証・コスト規則</text>

    <rect x="90" y="368" width="720" height="68" rx="14" fill="#fff0e6" stroke="#FF8A3D" stroke-width="2"/>
    <text x="450" y="398" font-size="22" font-weight="700" fill="#1E3A5F">2. APIとツール接続</text>
    <text x="450" y="422" font-size="16" fill="#1E3A5F">MCP Server・REST API・SQL・SDK</text>

    <rect x="90" y="462" width="720" height="68" rx="14" fill="#1E3A5F"/>
    <text x="450" y="492" font-size="22" font-weight="700" fill="#ffffff">1. 地理空間データ</text>
    <text x="450" y="516" font-size="16" fill="#ffffff">POI・道路・交通・人流・土地・画像</text>
  </g>

  <g fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M840 492 V120"/>
    <path d="M828 137 L840 120 L852 137"/>
  </g>
  <text x="862" y="310" transform="rotate(-90 862 310)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">データから判断へ</text>
</svg>
