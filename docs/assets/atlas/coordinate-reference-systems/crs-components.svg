<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">座標参照系と地図投影法の関係</title>
  <desc id="desc">測地基準と楕円体から地理座標系を定義し、地図投影法と投影パラメーターによって投影座標系へ変換する</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF8A3D"/>
    </marker>
    <style>
      .heading { font: 700 30px sans-serif; fill: #1E3A5F; }
      .label { font: 700 23px sans-serif; fill: #1E3A5F; }
      .value { font: 800 30px sans-serif; fill: #1E3A5F; }
      .small { font: 500 18px sans-serif; fill: #1E3A5F; }
      .white { font: 700 22px sans-serif; fill: #FFFFFF; }
      .box { fill: #FFFFFF; stroke: #1E3A5F; stroke-width: 4; }
      .arrow { fill: none; stroke: #FF8A3D; stroke-width: 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#F5F7FA"/>
  <text x="60" y="60" class="heading">CRSは「地球の基準・座標系・投影」を組み合わせる</text>

  <rect x="55" y="125" width="260" height="275" rx="20" class="box"/>
  <text x="185" y="174" text-anchor="middle" class="label">地球上の基準</text>
  <rect x="90" y="210" width="190" height="58" rx="29" fill="#1E3A5F"/>
  <text x="185" y="247" text-anchor="middle" class="white">測地基準</text>
  <rect x="90" y="292" width="190" height="58" rx="29" fill="#FF8A3D"/>
  <text x="185" y="329" text-anchor="middle" class="label">楕円体</text>
  <text x="185" y="376" text-anchor="middle" class="small">原点・向き・地球の形</text>

  <path d="M325 262 H400" class="arrow"/>

  <rect x="415" y="125" width="280" height="275" rx="20" class="box"/>
  <text x="555" y="174" text-anchor="middle" class="label">地理座標系</text>
  <text x="555" y="242" text-anchor="middle" class="value">緯度・経度</text>
  <text x="555" y="287" text-anchor="middle" class="small">角度単位</text>
  <text x="555" y="326" text-anchor="middle" class="small">例：WGS 84</text>
  <text x="555" y="365" text-anchor="middle" class="small">軸順にも注意</text>

  <path d="M705 262 H780" class="arrow"/>
  <rect x="715" y="170" width="170" height="58" rx="29" fill="#FF8A3D"/>
  <text x="800" y="207" text-anchor="middle" class="label">地図投影</text>
  <text x="800" y="318" text-anchor="middle" class="small">中心経度・標準緯線</text>
  <text x="800" y="350" text-anchor="middle" class="small">縮尺・原点を指定</text>

  <rect x="895" y="125" width="250" height="275" rx="20" class="box"/>
  <text x="1020" y="174" text-anchor="middle" class="label">投影座標系</text>
  <text x="1020" y="242" text-anchor="middle" class="value">X・Y</text>
  <text x="1020" y="287" text-anchor="middle" class="small">長さの単位</text>
  <text x="1020" y="326" text-anchor="middle" class="small">例：Webメルカトル</text>
  <text x="1020" y="365" text-anchor="middle" class="small">UTM・地域CRS</text>

  <rect x="185" y="450" width="830" height="60" rx="30" fill="#1E3A5F"/>
  <text x="600" y="488" text-anchor="middle" class="white">座標値にはCRSの識別子・軸順・単位・適用範囲を添える</text>
</svg>
