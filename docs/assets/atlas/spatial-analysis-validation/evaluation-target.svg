<svg xmlns="http://www.w3.org/2000/svg" width="540" height="645" viewBox="0 0 540 645" role="img" aria-labelledby="title desc">
<title id="title">評価は使う場面から決める</title>
<desc id="desc">観測点付近を含む地図、未知の地域、将来の時点に応じて検証を設計する。三つの用途は排他的ではなく、性能の優劣を示す図ではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="645" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">評価は使う場面から決める</text>
<text x="270" y="82" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">何を予測するかで、検証を選ぶ</text><rect x="30" y="110" width="480" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">観測点の近くも含む地図</text><text x="270.0" y="167" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">対象地域を代表する地点で確かめる</text><rect x="30" y="220" width="480" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="249" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">学習していない地域</text><text x="270.0" y="277" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">地域を分け、距離・環境差を確かめる</text><rect x="30" y="330" width="480" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="359" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">将来の時点</text><text x="270.0" y="387" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">時間で分け、未来情報の混入を防ぐ</text><text x="270" y="458" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">三つは組み合わせて評価することもある</text><rect x="30" y="495" width="480" height="80" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="524" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">スコアと適用範囲を一緒に記録</text><text x="270.0" y="552" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">地域・時点・分割条件・誤差の内訳</text><text x="270" y="614" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">空間分割だけで正しさは保証されない</text>
</g></svg>
