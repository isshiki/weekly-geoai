<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">捕捉率の違いによる推計人数の変化</title>
  <desc id="desc">50人を検知したとき、捕捉率15パーセントでは333人、18パーセントでは278人と推計される</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF8A3D"/>
    </marker>
    <style>
      .heading { font: 700 30px sans-serif; fill: #1E3A5F; }
      .label { font: 700 24px sans-serif; fill: #1E3A5F; }
      .value { font: 800 46px sans-serif; fill: #1E3A5F; }
      .small { font: 500 19px sans-serif; fill: #1E3A5F; }
      .box { fill: #FFFFFF; stroke: #1E3A5F; stroke-width: 4; }
      .arrow { fill: none; stroke: #FF8A3D; stroke-width: 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#F5F7FA"/>
  <text x="60" y="62" class="heading">捕捉率の小さな差が推計値で増幅される</text>

  <rect x="65" y="175" width="250" height="200" rx="20" class="box"/>
  <text x="190" y="226" text-anchor="middle" class="label">検知人数</text>
  <text x="190" y="302" text-anchor="middle" class="value">50人</text>
  <text x="190" y="342" text-anchor="middle" class="small">同じ観測値</text>

  <path d="M325 250 C390 250 405 160 475 160" class="arrow"/>
  <path d="M325 300 C390 300 405 390 475 390" class="arrow"/>

  <rect x="490" y="105" width="250" height="150" rx="20" fill="#FF8A3D"/>
  <text x="615" y="158" text-anchor="middle" class="label">捕捉率 15%</text>
  <text x="615" y="218" text-anchor="middle" class="small">50 ÷ 0.15</text>

  <rect x="490" y="325" width="250" height="150" rx="20" fill="#FF8A3D"/>
  <text x="615" y="378" text-anchor="middle" class="label">捕捉率 18%</text>
  <text x="615" y="438" text-anchor="middle" class="small">50 ÷ 0.18</text>

  <path d="M750 180 H845" class="arrow"/>
  <path d="M750 400 H845" class="arrow"/>

  <rect x="860" y="105" width="275" height="150" rx="20" class="box"/>
  <text x="997" y="158" text-anchor="middle" class="label">推計人数</text>
  <text x="997" y="220" text-anchor="middle" class="value">約333人</text>

  <rect x="860" y="325" width="275" height="150" rx="20" class="box"/>
  <text x="997" y="378" text-anchor="middle" class="label">推計人数</text>
  <text x="997" y="440" text-anchor="middle" class="value">約278人</text>

  <text x="600" y="525" text-anchor="middle" class="small">捕捉率は3ポイントの差でも、推計結果には55人の差が生じる</text>
</svg>
