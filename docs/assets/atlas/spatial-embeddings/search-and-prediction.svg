<svg xmlns="http://www.w3.org/2000/svg" width="540" height="670" viewBox="0 0 540 670" role="img" aria-labelledby="title desc">
<title id="title">埋め込み：検索と予測の違い</title>
<desc id="desc">類似地域検索は埋め込みを比べて候補を点検する。売上予測は売上実績などを加えてモデルを学習し、未使用データで誤差を測る。いずれも因果効果の検証とは異なる。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="670" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">埋め込み：検索と予測の違い</text>
<text x="270" y="86" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">同じ特徴でも、問いを分ける</text><rect x="30" y="110" width="480" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">1  類似地域を探す</text><text x="270.0" y="167" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">比較可能な埋め込み ＋ 地域ID</text><path d="M 270 192 V 220" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="230" width="480" height="80" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="259" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">類似度と候補地域の順位</text><text x="270.0" y="287" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">元画像・属性で目的への適合を確認</text><text x="270" y="350" text-anchor="middle" font-size="21" font-weight="400" fill="#1E3A5F">検索の順位だけでは売上は決まらない</text><rect x="30" y="390" width="480" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="419" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">2  売上を予測する</text><text x="270.0" y="447" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">埋め込み ＋ 売上実績・店舗属性など</text><path d="M 270 472 V 500" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="510" width="480" height="80" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="539" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">学習したモデルで売上を予測</text><text x="270.0" y="567" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">未使用データの誤差と基準モデルを比較</text><text x="270" y="634" text-anchor="middle" font-size="21" font-weight="400" fill="#1E3A5F">どちらも、施策の因果効果とは別の問い</text>
</g></svg>
