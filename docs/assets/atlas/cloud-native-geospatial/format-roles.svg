<svg xmlns="http://www.w3.org/2000/svg" width="540" height="632" viewBox="0 0 540 632" role="img" aria-labelledby="title desc">
<title id="title">形式と処理の役割を分ける</title>
<desc id="desc">STACは任意の発見用カタログ。三つの独立した例として、GeoParquetをSQL分析、COGを画像解析、PMTilesをWeb表示に使う。変換の順序や必須構成を示す図ではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="632" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">形式と処理の役割を分ける</text>
<rect x="30" y="80" width="480" height="80" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="109" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">STAC：資産を探す</text><text x="270.0" y="137" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">時点・範囲・取得先を記述</text><text x="270" y="198" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">導入は任意。以下は三つの利用例</text><rect x="20" y="230" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="133.0" y="259" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">GeoParquet</text><text x="133.0" y="287" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">形状と属性</text><path d="M 247 270 H 289" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="292" y="230" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="405.0" y="259" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">SQL分析</text><text x="405.0" y="287" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">抽出・集計</text><rect x="20" y="350" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="133.0" y="379" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">COG</text><text x="133.0" y="407" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">画像・標高</text><path d="M 247 390 H 289" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="292" y="350" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="405.0" y="379" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">画像解析</text><text x="405.0" y="407" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">必要な範囲を読む</text><rect x="20" y="470" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="133.0" y="499" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">PMTiles</text><text x="133.0" y="527" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">地図タイル</text><path d="M 247 510 H 289" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="292" y="470" width="226" height="80" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="405.0" y="499" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Web地図</text><text x="405.0" y="527" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">表示する</text><text x="270" y="602" text-anchor="middle" font-size="21" font-weight="400" fill="#1E3A5F">部分取得は配置・配信・読むツール次第</text>
</g></svg>
