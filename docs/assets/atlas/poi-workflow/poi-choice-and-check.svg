<svg xmlns="http://www.w3.org/2000/svg" width="540" height="670" viewBox="0 0 540 670" role="img" aria-labelledby="title desc">
<title id="title">POIの候補選びと確認</title>
<desc id="desc">用途によりOverture、Foursquare、OpenStreetMapを候補とする。どの候補も同じ小範囲で試し、条件と品質を確認する。順位や排他的な選択を示す図ではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="670" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">POIの候補選びと確認</text>
<text x="270" y="80" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">目的に合う入口を選ぶ（複数でもよい）</text><rect x="24" y="108" width="468" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="258.0" y="137" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Overture Places</text><text x="258.0" y="165" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">公開ファイルをSQLで分析</text><path d="M 492 144 H 512" fill="none" stroke="#1E3A5F" stroke-width="2.5"/><rect x="24" y="198" width="468" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="258.0" y="227" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Foursquare Open Source Places</text><text x="258.0" y="255" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">店舗・施設の分類から抽出</text><path d="M 492 234 H 512" fill="none" stroke="#1E3A5F" stroke-width="2.5"/><rect x="24" y="288" width="468" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="258.0" y="317" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">OpenStreetMap</text><text x="258.0" y="345" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">店舗に加え、道路や建物も扱う</text><path d="M 492 324 H 512" fill="none" stroke="#1E3A5F" stroke-width="2.5"/><path d="M 512 144 V 392 H 270 V 418" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="420" width="468" height="76" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="258.0" y="449" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">同じ小さな範囲で試す</text><text x="258.0" y="477" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">利用条件・取得上限・データ版を確認</text><path d="M 270 496 V 526" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="468" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="258.0" y="557" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">条件をそろえ、適合性を確かめる</text><text x="258.0" y="585" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">カテゴリ・重複・欠損・営業状態</text><text x="270" y="642" text-anchor="middle" font-size="21" font-weight="400" fill="#1E3A5F">上から品質順ではない。件数だけで選ばない。</text>
</g></svg>
