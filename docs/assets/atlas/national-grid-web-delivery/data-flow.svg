<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">全国メッシュデータをWeb地図へ配信する構成</title>
  <desc id="desc">配布データをGeoParquetへ変換し、検索用のDuckDBと描画用のPMTilesに分け、APIと静的配信を通じてWeb地図から利用する</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF8A3D"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #1E3A5F; }
      .label { font: 700 24px sans-serif; fill: #1E3A5F; }
      .small { font: 500 18px sans-serif; fill: #1E3A5F; }
      .white { font: 700 24px sans-serif; fill: #FFFFFF; }
      .box { fill: #FFFFFF; stroke: #1E3A5F; stroke-width: 4; }
      .primary { fill: #1E3A5F; stroke: #1E3A5F; stroke-width: 4; }
      .accent { fill: #FFF3EB; stroke: #FF8A3D; stroke-width: 4; }
      .arrow { fill: none; stroke: #FF8A3D; stroke-width: 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#F5F7FA"/>
  <text x="60" y="62" class="title">全国メッシュを「原本・検索・描画」に分ける</text>

  <rect x="50" y="245" width="190" height="110" rx="18" class="box"/>
  <text x="145" y="290" text-anchor="middle" class="label">配布データ</text>
  <text x="145" y="325" text-anchor="middle" class="small">ZIP / Shapefile</text>

  <path d="M245 300 H340" class="arrow"/>

  <rect x="355" y="225" width="220" height="150" rx="18" class="primary"/>
  <text x="465" y="280" text-anchor="middle" class="white">GeoParquet</text>
  <text x="465" y="320" text-anchor="middle" class="white">原本・交換</text>
  <text x="465" y="352" text-anchor="middle" class="white">再処理の入力</text>

  <path d="M580 270 C650 270 630 170 700 170" class="arrow"/>
  <path d="M580 330 C650 330 630 445 700 445" class="arrow"/>

  <rect x="715" y="105" width="220" height="130" rx="18" class="accent"/>
  <text x="825" y="158" text-anchor="middle" class="label">DuckDB Spatial</text>
  <text x="825" y="195" text-anchor="middle" class="small">集計・検索・詳細属性</text>

  <rect x="715" y="380" width="220" height="130" rx="18" class="accent"/>
  <text x="825" y="433" text-anchor="middle" class="label">PMTiles</text>
  <text x="825" y="470" text-anchor="middle" class="small">LOD・描画用属性</text>

  <path d="M940 170 H1010" class="arrow"/>
  <path d="M940 445 H1010" class="arrow"/>

  <rect x="1025" y="105" width="130" height="130" rx="18" class="box"/>
  <text x="1090" y="158" text-anchor="middle" class="label">詳細API</text>
  <text x="1090" y="195" text-anchor="middle" class="small">1件取得</text>

  <rect x="1025" y="380" width="130" height="130" rx="18" class="box"/>
  <text x="1090" y="425" text-anchor="middle" class="label">静的配信</text>
  <text x="1090" y="462" text-anchor="middle" class="small">HTTP Range</text>
  <text x="1090" y="489" text-anchor="middle" class="small">Request</text>

  <path d="M1090 240 V285" class="arrow"/>
  <path d="M1090 375 V330" class="arrow"/>
  <rect x="955" y="275" width="200" height="70" rx="35" class="primary"/>
  <text x="1055" y="319" text-anchor="middle" class="white">Web地図UI</text>

  <rect x="200" y="565" width="800" height="50" rx="25" fill="#FF8A3D"/>
  <text x="600" y="598" text-anchor="middle" class="label">低ズームでは粗い集約へ切り替え、不要な250mセルを送らない</text>
</svg>
