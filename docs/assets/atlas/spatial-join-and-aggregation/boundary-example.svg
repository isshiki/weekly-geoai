<svg xmlns="http://www.w3.org/2000/svg" width="540" height="615" viewBox="0 0 540 615" role="img" aria-labelledby="title desc">
<title id="title">境界上の点をどう数えるか</title>
<desc id="desc">P1はA、P2はBの内部。P3は共有境界。withinではP3が未所属、covered_byではAとBの両方に対応する。実在の地域ではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="615" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">境界上の点をどう数えるか</text>
<text x="270" y="82" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">点と区域の対応を考える模式例</text><rect x="50" y="110" width="220" height="200" fill="#e8eef5" stroke="#1E3A5F" stroke-width="2"/><rect x="270" y="110" width="220" height="200" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="140" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">区域A</text><text x="390" y="143" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">区域B</text><circle cx="130" cy="200" r="9" fill="#1E3A5F" stroke="white" stroke-width="2"/><text x="130" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">P1</text><circle cx="395" cy="200" r="9" fill="#1E3A5F" stroke="white" stroke-width="2"/><text x="395" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">P2</text><circle cx="270" cy="265" r="9" fill="#1E3A5F" stroke="white" stroke-width="2"/><text x="270" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">P3</text><text x="270" y="347" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">P3はAとBの共有境界上</text><rect x="30" y="375" width="480" height="76" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="404" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">内部だけ：within</text><text x="270.0" y="432" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">P1 → A ／ P2 → B ／ P3 → 未所属</text><rect x="30" y="470" width="480" height="76" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="270.0" y="499" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">境界も含む：covered_by</text><text x="270.0" y="527" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">P1 → A ／ P2 → B ／ P3 → A・B</text><text x="270" y="587" text-anchor="middle" font-size="21" font-weight="400" fill="#1E3A5F">元の点3件に対し、対応は2行または4行</text>
</g></svg>
