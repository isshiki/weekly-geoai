<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
<title id="title">境界だけを変えた6店舗の集計</title>
<desc id="desc">同じ6点を左右に分けると各3件、上下に分けると上6件と下0件。区域面積は同じ。</desc>
<rect width="800" height="360" rx="12" fill="#fff"/>

<g fill="#f1f5f9" stroke="#1E3A5F" stroke-width="3">
<rect x="50" y="65" width="300" height="220"/><rect x="450" y="65" width="300" height="220"/>
</g>
<path d="M200 65V285 M450 175H750" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="8 5"/>
<g fill="#FF8A3D" stroke="#1E3A5F" stroke-width="1.5">
<circle cx="95" cy="100" r="9"/><circle cx="145" cy="105" r="9"/><circle cx="170" cy="140" r="9"/>
<circle cx="230" cy="100" r="9"/><circle cx="270" cy="130" r="9"/><circle cx="310" cy="105" r="9"/>
<circle cx="495" cy="100" r="9"/><circle cx="545" cy="105" r="9"/><circle cx="570" cy="140" r="9"/>
<circle cx="630" cy="100" r="9"/><circle cx="670" cy="130" r="9"/><circle cx="710" cy="105" r="9"/>
</g><g font-family="sans-serif" fill="#1E3A5F" font-size="22" text-anchor="middle">
<text x="200" y="38">左右に分ける</text><text x="600" y="38">上下に分ける</text>
<text x="125" y="312">3件</text><text x="275" y="312">3件</text>
<text x="600" y="165">6件</text><text x="600" y="245">0件</text>
<text x="400" y="346" font-size="18">店舗の位置と区域の面積は同じ（架空の例）</text></g></svg>
