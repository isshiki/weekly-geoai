<svg xmlns="http://www.w3.org/2000/svg" width="540" height="660" viewBox="0 0 540 660" role="img" aria-labelledby="title desc">
<title id="title">問いから検証へ</title>
<desc id="desc">五つの段階を進め、結果に問題があればデータ選びや条件の整理に戻る。AIの利用はこの流れの一部であり、検証を省略しない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/></marker></defs>
<rect width="540" height="660" rx="16" fill="#f7f9fc"/>
<g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="270" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">問いから検証へ</text>
<rect x="90" y="80" width="390" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="285.0" y="109" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">1  問いを決める</text><text x="285.0" y="137" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">場所・対象・時点</text><path d="M 285 152 V 178" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="180" width="390" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="285.0" y="209" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">2  データを選ぶ</text><text x="285.0" y="237" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">利用条件・更新日・属性</text><path d="M 285 252 V 278" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="280" width="390" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="285.0" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">3  条件をそろえる</text><text x="285.0" y="337" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">座標系・分類・重複</text><path d="M 285 352 V 378" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="380" width="390" height="72" rx="12" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/><text x="285.0" y="409" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">4  分析して地図にする</text><text x="285.0" y="437" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">集計・分布の確認</text><path d="M 285 452 V 478" fill="none" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="480" width="390" height="72" rx="12" fill="#fff0e6" stroke="#1E3A5F" stroke-width="2"/><text x="285.0" y="509" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">5  結果を確かめる</text><text x="285.0" y="537" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">原典との照合・偏りの説明</text><path d="M 90 516 H 36 V 216 H 88" fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270" y="592" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">合わなければ、データや条件を見直す</text><text x="270" y="632" text-anchor="middle" font-size="22" font-weight="400" fill="#1E3A5F">AIを使う段階でも、結果の確認は必要</text>
</g></svg>
